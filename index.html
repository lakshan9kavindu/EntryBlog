<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>

<body>
    <header>
        <div class="full-header">
        <section class="navigation">
            <div class="navbar">
                <div class="logo">
                    <img src="assets/logo/logo.png" alt="Logo">
                </div>
                <div class="nav-links">
                    <ul>
                        <li class="active"><a href="#">Home</a></li>
                        <li><a href="#">Categories</a></li>
                        <li><a href="#">About us</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </div>
                <div class="search-bar">
                    <input type="text" placeholder="Search...">
                    <img src="assets/icons/Search-white.png" alt="Search Icon">
                </div>
                <div class="user-profile">
                    <img src="assets/icons/login-black.png" alt="User Icon">
                </div>
            </div>
        </section>
        <section>
            <div class="main-header">
                <div class="social-icon">
                    <div class="line">

                    </div>
                    <div class="social-links">
                        <a href="#"><img src="assets/icons/facebook.png" alt="Facebook"></a>
                        <a href="#"><img src="assets/icons/Instagram Circle.png" alt="instagram"></a>
                        <a href="#"><img src="assets/icons/Medium.png" alt="medium"></a>
                    </div>
                </div>
                <div class="text-vector">
                    <img src="assets/texts/header h1.png" alt="header h1">
                    <div class="header-button">
                        <div class="e-more">
                            <p>Explore more...</p>
                            <img src="assets/icons/Down Button.png" alt="explore more">
                        </div>
                        <div class="s-down">
                            <p>Scroll Down...</p>
                            <img src="assets/icons/Down Button.png" alt="Scroll down">
                        </div>
                    </div>
                </div>
                <div class="hot-article">
                    <div class="lable">
                        <div class="dot"></div>
                        <p>Latest</p>
                    </div>
                    <div class="post-image">
                        <img src="assets/sample.png" alt="post image">
                    </div>
                    <div class="category">
                        <p>Technology</p>
                    </div>
                    <div class="topic">
                        <h2>The Future of Artificial Intelligence</h2>
                    </div>
                    <div class="short-description">
                        <h3>Explore how AI is transforming industries and daily life.</h3>
                    </div>
                    <section class="article-profile">
                        <div class="profile-dp">
                            <img src="assets/sample-dp.png" alt="profile dp">
                        </div>
                        <div class="author-name">
                            <p>John Doe</p>
                        </div>
                        <div class="publish-date">
                            <p>2026.05.11</p>
                        </div>
                        <div class="reading-time">
                            <p>5 min read</p>
                        </div>
                        <div class="down-icon">
                            <img src="assets/icons/Scroll Down.png" alt="down icon">
                        </div>
                    </section>
                </div>
                <div class="number-line-main">
                    <P class="active">1</P>
                    <div class="number-line"></div>
                    <P>2</P>
                    <P>3</P>
                    <p>4</P>
                </div>
            </div>
        </section>
        </div>
    </header>
</body>

</html>
